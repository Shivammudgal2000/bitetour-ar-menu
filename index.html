<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>BiteTour AR Menu</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* Forces the camera view canvas to stretch correctly without crashing */
        video, .a-canvas {
            width: 100vw !important;
            height: 100vh !important;
            top: 0 !important;
            left: 0 !important;
            position: absolute !important;
            object-fit: cover !important;
        }

        /* Full Screen Gatekeeper Screen to trigger mobile camera permissions safely */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111111;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            text-align: center;
        }

        .start-btn {
            background: #E63946;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(230, 57, 70, 0.4);
            margin-top: 20px;
        }

        /* Bottom UI Menu Overlay Details */
        .biz-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: none; /* Hidden until user taps start */
        }

        .menu-title { font-size: 20px; font-weight: 700; color: #111111; margin-bottom: 4px; }
        .menu-subtitle { color: #666666; font-size: 13px; margin-bottom: 16px; }
        .order-btn { background: #E63946; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h2 style="margin:0;">BiteTour Augmented Reality</h2>
        <p style="color:#aaa; font-size:14px; margin: 10px 0 0 0;">Tap below to initialize your interactive camera viewer</p>
        <button class="start-btn" id="start-ar-button">Open AR Menu</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; loadingScreen: #none;" 
             embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-light type="ambient" intensity="0.7"></a-light>
        <a-light type="directional" position="1 3 2" intensity="0.8"></a-light>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.4" height="0.1" color="#00b4d8"
                        material="roughness: 0.3; metalness: 0.6;"
                        animation="property: rotation; to: 90 360 0; loop: true; dur: 5000; easing: linear">
            </a-cylinder>
        </a-entity>
    </a-scene>

    <div class="biz-overlay" id="menu-overlay">
        <div class="menu-title">BiteTour AR Menu</div>
        <div class="menu-subtitle">Point camera lens at the blue SoftMIND card to see the 3D model.</div>
        <button class="order-btn" onclick="alert('Order received!')">Order Now</button>
    </div>

    <script>
        // Safely starts the camera feed only upon direct user gesture input
        document.getElementById('start-ar-button').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems['mindar-image-system'];
            
            // Fade out splash screen wrapper
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'block';
            
            // Force bootstrap the WebAR camera feed hardware stream safely
            arSystem.start(); 

            // Kick off standard viewport sizing adjustment
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 500);
        });
    </script>

</body>
</html>

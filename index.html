<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteTour Test</title>
    <style>
        body { margin: 0; background: black; font-family: sans-serif; overflow: hidden; }
        video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; top:0; left:0; z-index: 1; }
        .ui { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; background: white; padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 280px; }
        button { background: #E63946; color: white; border: none; padding: 10px 20px; width: 100%; border-radius: 6px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>

    <div class="ui">
        <h3 style="margin:0 0 5px 0;">BiteTour Test Engine</h3>
        <p style="margin:0; color:#666; font-size:14px;">If you see your camera feed, your connection is successful!</p>
        <button onclick="alert('System working!')">Order Now</button>
    </div>

    <script>
        // Force initiate raw mobile device camera stream
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('webcam').srcObject = stream; })
            .catch(err => { alert("Camera block error: " + err); });
    </script>
</body>
</html>

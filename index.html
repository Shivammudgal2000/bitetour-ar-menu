<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>BiteTour AR Menu</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* HARD-FORCE RAW VIDEO CAMERA FEED TO FILL THE VIEWPORT MINUS THE ZOOM BUG */
        video {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            object-fit: cover !important;
            z-index: 0 !important;
        }

        /* Forces the 3D matching canvas engine layout to map 1:1 over the video stream */
        .a-canvas {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 2 !important;
        }

        /* Fixed floating interface overlay */
        .biz-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .menu-title { font-size: 20px; font-weight: 700; color: #111111; margin-bottom: 4px; }
        .menu-subtitle { color: #666666; font-size: 13px; margin-bottom: 16px; }
        .order-btn { background: #E63946; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <a-scene embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #00b4d8; opacity: 0.95;"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
            </a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="biz-overlay">
        <div class="menu-title">BiteTour AR Menu</div>
        <div class="menu-subtitle">Point your unzoomed camera feed directly at the HIRO marker square.</div>
        <button class="order-btn" onclick="alert('Order sent to the kitchen!')">Order Now</button>
    </div>

    <script>
        // Force rendering canvas adjustment instantly on hardware initialization
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                
                // Extra security check: Force look for local camera tags and keep them wide-angle
                const videoElement = document.querySelector('video');
                if (videoElement) {
                    videoElement.style.setProperty('width', '100vw', 'important');
                    videoElement.style.setProperty('height', '100vh', 'important');
                }
            }, 600);
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteTour AR Menu</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .biz-overlay {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: white;
            padding: 16px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            text-align: center;
        }
        .order-btn {
            background: #E63946;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind; loadingScreen: #none;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.005 0.005 0.005" src="#avatarModel"></a-gltf-model>
        </a-entity>
    </a-scene>

    <div class="biz-overlay">
        <h3 style="margin: 0 0 4px 0;">Gourmet Menu Preview</h3>
        <p style="margin: 0 0 12px 0; color: #666; font-size: 14px;">Scan the restaurant logo to view ingredients</p>
        <button class="order-btn" onclick="alert('Item added to kitchen cart!')">Order Now</button>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>BiteTour AR Menu</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000;
        }
        /* Hard-forces the tracking camera canvas to occupy full viewport real-estate */
        .a-canvas, video, .a-enter-vr {
            width: 100vw !important;
            height: 100vh !important;
            top: 0 !important;
            left: 0 !important;
            position: absolute !important;
            object-fit: cover !important;
        }
        .biz-overlay {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: white;
            padding: 16px;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            font-family: sans-serif;
        }
        .order-btn {
            background: #E63946;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #00b4d8; opacity: 0.9;"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
            </a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div class="biz-overlay">
        <h3 style="margin: 0;">Gourmet AR Menu</h3>
        <p style="margin: 5px 0; color: #666; font-size: 14px;">Point your camera at the HIRO marker</p>
        <button class="order-btn" onclick="alert('Item added to cart!')">Order Now</button>
    </div>

</body>
</html>

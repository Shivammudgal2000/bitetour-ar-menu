<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteTour AR Menu</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        .biz-overlay {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: white;
            padding: 16px;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
        }
        .order-btn {
            background: #E63946;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.5" height="0.2" color="#00b4d8"
                        animation="property: rotation; to: 90 360 0; loop: true; dur: 5000; easing: linear">
            </a-cylinder>
        </a-entity>
    </a-scene>

    <div class="biz-overlay">
        <h3 style="margin: 0;">Gourmet AR Menu</h3>
        <p style="margin: 5px 0; color: #666; font-size: 14px;">Scan the blue SoftMIND card to see the 3D model</p>
        <button class="order-btn" onclick="alert('Order Sent!')">Order Now</button>
    </div>

</body>
</html>
